<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevLog — Saat Takip</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Roboto:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}
:root {
  --bg:#f6f4fb;
  --surface:#fff;
  --surface2:#faf9fd;
  --border:#e7e3ef;
  --accent:#6442D6;
  --accent2:#C8B3FD;
  --accent3:#7b61d1;
  --text:#111827;
  --text-dim:#4b5563;
  --text-muted:#667085;
  --red:#b42318;
  --font-mono:'Fira Code',monospace;
  --font-body:'Inter',sans-serif;
  --font-head:'Roboto',sans-serif;
  --shadow:0 8px 28px rgba(41,26,89,.07);
}
body {
  background:radial-gradient(ellipse at 12% 0%,#eee8ff 0,transparent 34rem),var(--bg);
  color:var(--text);
  font:15px/1.55 var(--font-body);
  min-height:100vh;
}
button,input,textarea,select {
  font:inherit;
}
button {
  cursor:pointer;
}
:focus-visible {
  outline:3px solid #9b82f3;
  outline-offset:3px;
}
.app {
  max-width:1080px;
  margin:auto;
  padding:32px 28px 56px;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0 26px;
  border-bottom:1px solid var(--border);
  margin-bottom:28px;
}
.logo {
  font:700 30px/1 var(--font-head);
  letter-spacing:-1.2px;
  color:var(--accent);
}
.logo span {
  font:500 15px var(--font-body);
  color:#77708a;
  letter-spacing:0;
}
.header-meta {
  color:var(--text-muted);
  font-size:12px;
}
.live-clock {
  font:600 18px var(--font-mono);
  color:var(--text);
}
.tabs {
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
  overflow-x:auto;
}
.tab {
  background:transparent;
  color:var(--text-dim);
  border:0;
  border-bottom:3px solid transparent;
  margin-bottom:-1px;
  padding:13px 18px;
  white-space:nowrap;
  font-weight:600;
  font-size:14px;
  transition:.2s;
}
.tab:hover {
  color:var(--accent);
  background:#f0ebff;
}
.tab.active {
  color:var(--accent);
  border-bottom-color:var(--accent);
}
.tab-content {
  display:none;
}
.tab-content.active {
  display:block;
}
.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
}
.card.accent-top,.card.accent2-top,.card.accent3-top {
  border-top:4px solid var(--accent);
}
.card.accent2-top {
  border-top-color:var(--accent2);
}
.section-title {
  font:600 18px var(--font-head);
  margin-bottom:24px;
  display:flex;
  align-items:center;
  gap:12px;
}
.section-title:after {
  content:'';
  height:1px;
  background:var(--border);
  flex:1;
}
.form-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}
.form-row.full {
  grid-template-columns:1fr;
}
label {
  display:block;
  font-size:12px;
  font-weight:600;
  color:#475467;
  margin-bottom:7px;
}
input,textarea,select {
  width:100%;
  background:#fff;
  border:1px solid #d0cadc;
  border-radius:8px;
  color:var(--text);
  font:14px var(--font-body);
  padding:12px 14px;
  min-height:48px;
  transition:border-color .18s,box-shadow .18s;
}
input:focus,textarea:focus,select:focus {
  outline:0;
  border-color:var(--accent);
  box-shadow:0 0 0 3px #6442d620;
}
input::placeholder,textarea::placeholder {
  color:#8b8795;
}
textarea {
  resize:vertical;
  min-height:100px;
}
input[type=checkbox] {
  accent-color:var(--accent);
}
.btn-row {
  display:flex;
  gap:12px;
  margin-top:20px;
}
button {
  border:0;
  border-radius:8px;
  padding:12px 20px;
  font-weight:600;
  transition:transform .18s,background .18s,box-shadow .18s;
}
button:hover {
  transform:translateY(-1px);
}
.btn-primary {
  background:var(--accent);
  color:white;
  flex:1;
  box-shadow:0 4px 10px #6442d633;
}
.btn-primary:hover {
  background:#5233bd;
}
.btn-primary:disabled {
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}
.btn-warning {
  background:var(--accent2);
  color:#21134a;
  flex:1;
}
.btn-secondary {
  background:white;
  color:var(--text-dim);
  border:1px solid var(--border);
}
.btn-secondary:hover {
  border-color:var(--accent);
  color:var(--accent);
}
.stats-bar {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}
.stat-card {
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  box-shadow:var(--shadow);
}
.stat-label {
  font-size:11px;
  color:var(--text-muted);
  font-weight:600;
  margin-bottom:6px;
}
.stat-value {
  font:600 23px var(--font-mono);
}
.c-accent {
  color:var(--accent);
}
.c-accent2 {
  color:#7654cb;
}
.c-accent3 {
  color:#48318f;
}
.log-filters {
  display:flex;
  gap:8px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.filter-btn {
  background:#fff;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:8px 13px;
  font-size:12px;
}
.filter-btn.active {
  background:#eee9ff;
  color:#4f32b5;
  border-color:#c8b3fd;
}
.filter-btn:hover {
  border-color:var(--accent);
}
.log-table {
  width:100%;
  border-collapse:collapse;
}
.log-table th {
  text-align:left;
  padding:10px 12px;
  font-size:11px;
  color:#667085;
  border-bottom:1px solid var(--border);
}
.log-table td {
  padding:14px 12px;
  border-bottom:1px solid #efedf3;
  vertical-align:top;
}
.log-table tr:hover td {
  background:#faf9fd;
}
.log-date {
  color:var(--text-dim);
  white-space:nowrap;
}
.log-hours {
  color:var(--accent);
  font:600 14px var(--font-mono);
  white-space:nowrap;
  text-align:right;
}
.log-actions {
  text-align:right;
}
.log-actions button {
  background:transparent;
  color:var(--text-muted);
  font-size:12px;
  padding:8px 10px;
}
.log-actions button:hover {
  color:var(--red);
  background:#fff3f2;
}
.project-tag {
  display:inline-block;
  background:#f0ebff;
  color:#4f32b5;
  border:1px solid #e3d9ff;
  border-radius:4px;
  padding:4px 8px;
  font-size:12px;
  font-weight:600;
  overflow-wrap:anywhere;
}
.empty-state {
  text-align:center;
  padding:48px 20px;
  color:var(--text-muted);
  border:1px dashed #cfc6df;
  border-radius:8px;
}
.empty-state .big {
  font-size:30px;
  margin-bottom:12px;
}
.loading {
  color:var(--text-muted);
  text-align:center;
  padding:32px;
}
.modal-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:#1b1533a8;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.open {
  display:flex;
}
.modal {
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow-x:hidden;
  overflow-y:auto;
  box-shadow:0 24px 80px #17102e40;
}
.modal-header {
  position:sticky;
  top:0;
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 22px;
  border-bottom:1px solid var(--border);
  z-index:1;
}
.modal-title {
  font:600 21px var(--font-head);
  color:var(--accent);
}
.modal-close {
  background:transparent;
  color:var(--text-dim);
  padding:8px 12px;
}
.modal-body {
  padding:22px;
}
.report-preview {
  background:#fff;
  color:#1a1a1a;
  padding:32px;
  font:12px/1.7 var(--font-mono);
  min-width:0;
}
.report-table-scroll {
  max-width:100%;
  overflow-x:auto;
  overscroll-behavior-x:contain;
  scrollbar-color:#9b82f3 #eee9f8;
  scrollbar-width:thin;
}
.report-table-scroll table {
  min-width:620px;
}
.report-preview h1 {
  font:700 28px var(--font-head);
  margin-bottom:4px;
}
.report-preview .report-meta {
  color:#555;
  margin-bottom:26px;
  padding-bottom:18px;
  border-bottom:2px solid #6442d6;
  font-size:11px;
}
.report-preview table {
  width:100%;
  border-collapse:collapse;
  margin-bottom:24px;
}
.report-preview th {
  text-align:left;
  padding:8px;
  background:#34246c;
  color:#fff;
  font-size:10px;
}
.report-preview td {
  padding:8px;
  border-bottom:1px solid #eee;
  font-size:11px;
}
.report-preview tr:nth-child(even) td {
  background:#f8f7fb;
}
.report-preview .total-row td {
  background:#eee9fa;
  font-weight:600;
  border-top:2px solid #6442d6;
}
.report-preview .summary-box {
  background:#f3efff;
  color:#24164f;
  padding:16px 20px;
  margin-top:20px;
  border-radius:8px;
}
.report-preview .summary-box .line {
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:4px 0;
  font-size:12px;
}
.report-preview .summary-box .grand-total {
  font-size:16px;
  font-weight:700;
  color:#4f32b5;
  padding-top:12px;
  margin-top:8px;
  border-top:1px solid #c8b3fd;
}
.toast {
  position:fixed;
  bottom:24px;
  right:24px;
  max-width:calc(100vw - 32px);
  background:#27203b;
  color:white;
  padding:13px 18px;
  border-radius:8px;
  font-size:13px;
  z-index:200;
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
  box-shadow:var(--shadow);
}
.toast.error {
  background:#b42318;
}
.toast.show {
  transform:translateY(0);
  opacity:1;
}
#login-screen {
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at 50% 10%,#e6ddff,transparent 55%),var(--bg);
}
#login-screen.hidden {
  display:none;
}
.login-card {
  width:100%;
  max-width:420px;
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:36px;
  box-shadow:0 20px 70px #3c27651a;
}
.login-card .logo {
  text-align:center;
  font-size:32px;
  margin-bottom:10px;
}
.login-subtitle {
  text-align:center;
  color:var(--text-muted);
  font-size:12px;
  margin-bottom:28px;
}
.login-card label {
  margin-bottom:8px;
}
.login-card input[type=text],.login-card input[type=password] {
  margin-bottom:16px;
}
.password-field {
  position:relative;
  margin-bottom:16px;
}
.password-field input {
  margin-bottom:0!important;
  padding-right:56px;
}
.password-toggle {
  position:absolute;
  top:4px;
  right:4px;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  padding:0;
  border:0;
  border-radius:6px;
  background:transparent;
  color:#667085;
}
.password-toggle:hover {
  background:#f0ebff;
  color:var(--accent);
}
.password-toggle svg {
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.login-remember {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:22px;
}
.login-remember input {
  width:18px;
  min-height:18px;
  margin:0;
}
.login-remember span {
  font-size:13px;
  color:var(--text-dim);
}
.login-card .btn-primary {
  width:100%;
  min-height:48px;
}
.login-submit {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.login-submit svg {
  width:19px;
  height:19px;
  flex:none;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.login-error {
  color:var(--red);
  font-size:12px;
  margin-top:12px;
  text-align:center;
}
#app-screen {
  display:none;
}
#app-screen.visible {
  display:block;
}
@media(max-width:700px) {
  .app {
    padding:22px 16px 40px;
  }
  header {
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  header > div:first-child {
    width:100%;
  }
  .header-meta {
    gap:10px!important;
    width:100%;
    justify-content:space-between;
  }
  .header-meta .btn-secondary {
    padding:8px 11px!important;
  }
  .tabs {
    margin-right:-16px;
    padding-right:16px;
  }
  .tab {
    padding:12px 13px;
  }
  .card {
    padding:20px 16px;
    border-radius:10px;
  }
  .form-row {
    grid-template-columns:1fr;
    gap:12px;
  }
  .stats-bar {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .stat-card {
    padding:14px;
  }
  .stat-value {
    font-size:20px;
  }
  .modal-overlay {
    padding:10px;
  }
  .modal {
    max-height:96vh;
  }
  .modal-header {
    padding:12px 14px;
  }
  .modal-title {
    font-size:18px;
  }
  .modal-header>div:last-child {
    gap:6px!important;
  }
  .modal-header .btn-secondary {
    padding:9px 10px!important;
    font-size:11px!important;
  }
  .modal-body {
    padding:12px;
  }
  .report-preview {
    padding:20px;
    width:100%;
    min-width:0;
  }
  .report-table-scroll::before {
    content:'Tabloyu yana kaydırarak görüntüleyin';
    display:block;
    color:#667085;
    font:11px var(--font-body);
    padding:0 2px 8px;
  }
  .report-preview .summary-box .line {
    align-items:flex-start;
    flex-wrap:wrap;
    gap:2px 12px;
  }
  .report-preview .summary-box .line span:last-child {
    overflow-wrap:anywhere;
    text-align:right;
  }
  .log-table thead {
    display:none;
  }
  .log-table,.log-table tbody,.log-table tr,.log-table td {
    display:block;
    width:100%;
  }
  .log-table tr {
    position:relative;
    background:white;
    border:1px solid var(--border);
    border-radius:8px;
    margin:0 0 12px;
    padding:12px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px 10px;
  }
  .log-table td {
    padding:0;
    border:0;
    min-width:0;
  }
  .log-table td:nth-child(1) {
    grid-column:1;
  }
  .log-table td:nth-child(2) {
    grid-column:1/-1;
    grid-row:2;
  }
  .log-table td:nth-child(3) {
    grid-column:1/-1;
    grid-row:3;
    overflow-wrap:anywhere;
  }
  .log-table td:nth-child(4) {
    grid-column:2;
    grid-row:1;
    text-align:right;
  }
  .log-table td:nth-child(5) {
    grid-column:2;
    grid-row:4;
    text-align:right;
  }
  .log-date {
    font-size:12px;
  }
  .log-actions button {
    min-height:36px;
  }
  .login-card {
    padding:28px 22px;
  }
}
@media(max-width:360px) {
  .app {
    padding-left:12px;
    padding-right:12px;
  }
  .tabs {
    margin-right:-12px;
    padding-right:12px;
  }
  .logo {
    font-size:26px;
  }
  .header-meta {
    font-size:10px;
  }
  .live-clock {
    font-size:15px;
  }
  header > div:first-child {
    margin-bottom:8px;
  }
  .header-meta > div {
    min-width:0;
  }
  .header-meta .btn-secondary {
    flex:none;
  }
  .tab {
    font-size:12px;
    padding:11px 9px;
  }
  .card {
    padding:18px 13px;
  }
  .stat-value {
    font-size:17px;
  }
  .report-preview {
    padding:16px;
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
@media print {
  body {
    background:#fff;
  }
  .modal-overlay {
    position:static;
    background:#fff;
    padding:0;
  }
  .modal {
    border:0;
    box-shadow:none;
    max-height:none;
    overflow:visible;
  }
  .modal-header {
    display:none;
  }
  .modal-body {
    padding:0;
  }
  .report-preview {
    overflow:visible;
  }
  .report-table-scroll {
    overflow:visible;
  }
  .report-table-scroll table {
    min-width:0;
  }
}
  </style>
</head>
<body>

<!-- LOGIN EKRANI (tek sayfa: giriş yapılınca gizlenir) -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">DevLog <span>tracker</span></div>
    <div class="login-subtitle">SAAT TAKİP SİSTEMİ</div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <label>Kullanıcı adı</label>
      <input type="text" id="login-user" name="username" autocomplete="username" required autofocus>
      <label>Şifre</label>
      <div class="password-field">
        <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Şifreyi göster" aria-pressed="false" onclick="togglePasswordVisibility()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="login-remember">
        <input type="checkbox" id="login-remember" name="rememberMe">
        <span>Beni hatırla</span>
      </div>
      <button type="submit" class="btn-primary login-submit" id="loginBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/></svg>
        <span id="loginBtnLabel">Giriş yap</span>
      </button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ANA UYGULAMA (giriş sonrası görünür) -->
<div id="app-screen" class="app">
  <header>
    <div>
      <div class="logo">DevLog <span>tracker</span></div>
      <div style="color:var(--text-muted);font-size:10px;letter-spacing:2px;margin-top:4px;">SAAT TAKİP SİSTEMİ</div>
    </div>
    <div class="header-meta" style="display:flex;align-items:center;gap:20px;">
      <div>
        <div class="live-clock" id="liveClock">00:00:00</div>
        <div id="liveDate" style="margin-top:4px;"></div>
      </div>
      <button type="button" class="btn-secondary" style="flex:none;padding:8px 16px;font-size:11px;" onclick="doLogout()">Çıkış</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('entry', this)">✏ Kayıt Ekle</button>
    <button class="tab" onclick="switchTab('log', this)">📋 Kayıtlar</button>
    <button class="tab" onclick="switchTab('report', this)">📊 Rapor</button>
  </div>

  <!-- ENTRY TAB -->
  <div id="tab-entry" class="tab-content active">
    <div class="card accent2-top">
      <div class="section-title">Yeni Çalışma Kaydı</div>
      <div class="form-row">
        <div>
          <label>Proje / Müşteri</label>
          <input type="text" id="m-project" placeholder="örn. Acme Corp - API" list="projectList" autocomplete="off">
          <datalist id="projectList"></datalist>
        </div>
        <div>
          <label>Tarih</label>
          <input type="date" id="m-date">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Başlangıç Saati</label>
          <input type="time" id="m-start">
        </div>
        <div>
          <label>Bitiş Saati</label>
          <input type="time" id="m-end">
        </div>
      </div>
      <div class="form-row full">
        <div>
          <label>Yapılan İş</label>
          <textarea id="m-desc" placeholder="Kullanıcı giriş ekranı tasarlandı, REST API endpoint'leri yazıldı..."></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btnSave" onclick="saveEntry()">+ Kaydet</button>
      </div>
    </div>
  </div>

  <!-- LOG TAB -->
  <div id="tab-log" class="tab-content">
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="stat-label">Yükleniyor</div><div class="stat-value">—</div></div>
      <div class="stat-card"><div class="stat-label">—</div><div class="stat-value">—</div></div>
      <div class="stat-card"><div class="stat-label">—</div><div class="stat-value">—</div></div>
      <div class="stat-card"><div class="stat-label">—</div><div class="stat-value">—</div></div>
    </div>
    <div class="card">
      <div class="section-title">Kayıtlar</div>
      <div class="log-filters" id="logFilters"></div>
      <div id="logContainer"><div class="loading">YÜKLENİYOR...</div></div>
    </div>
  </div>

  <!-- REPORT TAB -->
  <div id="tab-report" class="tab-content">
    <div class="card accent3-top">
      <div class="section-title">Rapor Oluştur</div>
      <div class="form-row">
        <div>
          <label>Başlangıç Tarihi</label>
          <input type="date" id="r-start">
        </div>
        <div>
          <label>Bitiş Tarihi</label>
          <input type="date" id="r-end">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Proje Filtresi (boş = hepsi)</label>
          <input type="text" id="r-project" placeholder="Proje adı..." list="projectList2" autocomplete="off">
          <datalist id="projectList2"></datalist>
        </div>
        <div>
          <label>Saatlik Ücret (₺, opsiyonel)</label>
          <input type="number" id="r-rate" placeholder="örn. 500">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Müşteri Adı</label>
          <input type="text" id="r-client" placeholder="Müşteri adı...">
        </div>
        <div>
          <label>Not (fatura #, dönem vb.)</label>
          <input type="text" id="r-note" placeholder="Fatura #001">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="openReport()">📄 Raporu Önizle & Yazdır</button>
      </div>
    </div>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Çalışma Raporu</div>
      <div style="display:flex;gap:10px;">
        <button class="btn-secondary" style="font-size:11px;padding:8px 16px;" onclick="printReport()">🖨 Yazdır / PDF</button>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body" id="reportContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ────────────────────────────────────────────────
let allEntries = [];
let projects   = [];
let currentFilter = 'all';

// ─── AUTH (tek sayfa: login ↔ uygulama) ────────────────────
function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-screen').classList.remove('visible');
}

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.add('visible');
}

async function checkAuth() {
  try {
    const res = await fetch('/api/auth/check', { credentials: 'include' });
    return res.ok;
  } catch (_) { return false; }
}

function togglePasswordVisibility() {
  const input = document.getElementById('login-pass');
  const button = document.getElementById('passwordToggle');
  const isVisible = input.type === 'password';
  const start = input.selectionStart;
  const end = input.selectionEnd;

  input.type = isVisible ? 'text' : 'password';
  button.setAttribute('aria-pressed', String(isVisible));
  button.setAttribute('aria-label', isVisible ? 'Şifreyi gizle' : 'Şifreyi göster');
  button.innerHTML = isVisible
    ? '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  input.focus();
  if (start !== null && end !== null) input.setSelectionRange(start, end);
}

async function doLogin(e) {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const remember = document.getElementById('login-remember').checked;
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  btn.disabled = true;
  btnLabel.textContent = 'Giriş yapılıyor...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass, rememberMe: remember })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errEl.textContent = data.error || 'Giriş başarısız.';
      return false;
    }
    showApp();
    initApp();
  } finally {
    btn.disabled = false;
    btnLabel.textContent = 'Giriş yap';
  }
  return false;
}

async function doLogout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  } catch (_) {}
  showLogin();
}

// ─── INIT ─────────────────────────────────────────────────
function initApp() {
  const now = new Date();
  document.getElementById('m-date').value  = fmtDate(now);
  document.getElementById('r-end').value   = fmtDate(now);
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('r-start').value = fmtDate(first);
  setInterval(updateClock, 1000);
  updateClock();
  loadProjects();
}

document.addEventListener('DOMContentLoaded', async () => {
  const ok = await checkAuth();
  if (ok) {
    showApp();
    initApp();
  }
});

// ─── CLOCK ────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('liveClock').textContent = now.toTimeString().slice(0,8);
  document.getElementById('liveDate').textContent  = now.toLocaleDateString('tr-TR', {weekday:'long',day:'numeric',month:'long'});
}

// ─── HELPERS ──────────────────────────────────────────────
function fmtDate(d) { return d.toISOString().split('T')[0]; }
function fmtHours(mins) {
  const h = Math.floor(mins/60), m = mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function fmtDisplayDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('tr-TR', {day:'numeric',month:'short',year:'numeric'});
}

// ─── API (cookie ile oturum) ───────────────────────────────
async function api(method, path, body) {
  const opts = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showLogin();
    throw new Error('Oturum sonlandı.');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Sunucu hatası');
  }
  return res.json();
}

async function loadProjects() {
  try {
    projects = await api('GET', '/api/projects');
    updateDataLists();
  } catch(e) { /* ignore */ }
}

function updateDataLists() {
  ['projectList','projectList2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = projects.map(p => `<option value="${escHtml(p)}">`).join('');
  });
}

// ─── TABS ─────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'log') loadLog();
}

// ─── SAVE ENTRY ───────────────────────────────────────────
async function saveEntry() {
  const project = document.getElementById('m-project').value.trim();
  const date    = document.getElementById('m-date').value;
  const start   = document.getElementById('m-start').value;
  const end     = document.getElementById('m-end').value;
  const desc    = document.getElementById('m-desc').value.trim();

  if (!project) { toast('Proje adı giriniz!', true); return; }
  if (!date)    { toast('Tarih seçiniz!', true); return; }
  if (!start || !end) { toast('Başlangıç ve bitiş saatini giriniz!', true); return; }

  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let minutes = (eh*60+em) - (sh*60+sm);
  if (minutes <= 0) minutes += 24*60;
  if (minutes < 1)  { toast('Geçersiz saat aralığı!', true); return; }

  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'KAYDEDİLİYOR...';

  try {
    await api('POST', '/api/entries', { project, date, start, end, minutes, desc });
    toast(`✓ ${fmtHours(minutes)} saat kaydedildi`);
    document.getElementById('m-start').value = '';
    document.getElementById('m-end').value   = '';
    document.getElementById('m-desc').value  = '';
    if (!projects.includes(project)) {
      projects.push(project);
      projects.sort();
      updateDataLists();
    }
  } catch(e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '+ KAYDET';
  }
}

// ─── LOAD LOG ─────────────────────────────────────────────
async function loadLog() {
  document.getElementById('logContainer').innerHTML = '<div class="loading">YÜKLENİYOR...</div>';
  try {
    allEntries = await api('GET', '/api/entries');
    renderLog();
  } catch(e) {
    document.getElementById('logContainer').innerHTML = `<div class="empty-state"><div class="big">⚠</div><div>${e.message}</div></div>`;
  }
}

function renderLog() {
  const now = new Date();
  const todayStr  = fmtDate(now);
  const monthStr  = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const todayMins = allEntries.filter(e => e.date === todayStr).reduce((a,e) => a+e.minutes, 0);
  const monthMins = allEntries.filter(e => e.date.startsWith(monthStr)).reduce((a,e) => a+e.minutes, 0);
  const totalMins = allEntries.reduce((a,e) => a+e.minutes, 0);

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Bugün</div><div class="stat-value c-accent">${fmtHours(todayMins)}</div></div>
    <div class="stat-card"><div class="stat-label">Bu Ay</div><div class="stat-value c-accent2">${fmtHours(monthMins)}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam</div><div class="stat-value c-accent3">${fmtHours(totalMins)}</div></div>
    <div class="stat-card"><div class="stat-label">Kayıt Sayısı</div><div class="stat-value">${allEntries.length}</div></div>
  `;

  const projs = [...new Set(allEntries.map(e => e.project))];
  const fc = document.getElementById('logFilters');
  fc.innerHTML = `<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">Tümü</button>`;
  projs.forEach(p => {
    fc.innerHTML += `<button class="filter-btn ${currentFilter===p?'active':''}" onclick="setFilter(${JSON.stringify(p)})">${escHtml(p)}</button>`;
  });

  const filtered = currentFilter === 'all' ? allEntries : allEntries.filter(e => e.project === currentFilter);
  const container = document.getElementById('logContainer');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="big">📭</div><div>Henüz kayıt yok.</div></div>`;
    return;
  }

  const rows = filtered.map(e => `
    <tr>
      <td class="log-date">${fmtDisplayDate(e.date)}<br><span style="color:var(--text-muted);font-size:11px;">${e.start||''}${e.end?' → '+e.end:''}</span></td>
      <td><span class="project-tag">${escHtml(e.project)}</span></td>
      <td style="color:var(--text);max-width:300px">${escHtml(e.desc||'') || '<span style="color:var(--text-muted)">—</span>'}</td>
      <td class="log-hours">${fmtHours(e.minutes)}</td>
      <td class="log-actions"><button onclick="deleteEntry(${e.id})">sil</button></td>
    </tr>
  `).join('');

  container.innerHTML = `
    <table class="log-table">
      <thead><tr>
        <th>Tarih / Saat</th><th>Proje</th><th>Açıklama</th>
        <th style="text-align:right">Süre</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function setFilter(val) { currentFilter = val; renderLog(); }

async function deleteEntry(id) {
  if (!confirm('Bu kaydı silmek istiyor musunuz?')) return;
  try {
    await api('DELETE', `/api/entries/${id}`);
    allEntries = allEntries.filter(e => e.id !== id);
    renderLog();
    toast('Kayıt silindi');
  } catch(e) { toast(e.message, true); }
}

// ─── REPORT ───────────────────────────────────────────────
async function openReport() {
  const start  = document.getElementById('r-start').value;
  const end    = document.getElementById('r-end').value;
  const proj   = document.getElementById('r-project').value.trim();
  const rate   = parseFloat(document.getElementById('r-rate').value) || 0;
  const client = document.getElementById('r-client').value.trim() || 'Müşteri';
  const note   = document.getElementById('r-note').value.trim();

  if (!start || !end) { toast('Tarih aralığı seçiniz!', true); return; }

  let qs = `?from=${start}&to=${end}`;
  if (proj) qs += `&project=${encodeURIComponent(proj)}`;

  let data;
  try { data = await api('GET', '/api/entries' + qs); }
  catch(e) { toast(e.message, true); return; }

  data.sort((a,b) => a.date.localeCompare(b.date));
  const totalMins   = data.reduce((a,e) => a+e.minutes, 0);
  const totalHours  = totalMins / 60;
  const totalAmount = rate ? totalHours * rate : 0;

  const rows = data.map(e => `
    <tr>
      <td>${fmtDisplayDate(e.date)}</td>
      <td>${escHtml(e.project)}</td>
      <td>${e.start||''}${e.end?' - '+e.end:''}</td>
      <td>${escHtml(e.desc||'—')}</td>
      <td style="text-align:right;font-weight:600">${fmtHours(e.minutes)}</td>
      ${rate ? `<td style="text-align:right">${(e.minutes/60*rate).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</td>` : ''}
    </tr>`).join('');

  document.getElementById('reportContent').innerHTML = `
    <div class="report-preview" id="printArea">
      <h1>Çalışma Raporu</h1>
      <div class="report-meta">
        <strong>Müşteri:</strong> ${escHtml(client)}${note ? ` &nbsp;·&nbsp; ${escHtml(note)}` : ''}<br>
        <strong>Dönem:</strong> ${fmtDisplayDate(start)} – ${fmtDisplayDate(end)}<br>
        ${proj ? `<strong>Proje:</strong> ${escHtml(proj)}<br>` : ''}
        <strong>Oluşturma:</strong> ${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}
      </div>
      <div class="report-table-scroll" tabindex="0" role="region" aria-label="Çalışma raporu tablosu; yatay kaydırılabilir">
      <table>
        <thead><tr>
          <th>Tarih</th><th>Proje</th><th>Saat Aralığı</th><th>Açıklama</th><th>Süre</th>
          ${rate ? '<th>Tutar</th>' : ''}
        </tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td colspan="4"><strong>TOPLAM</strong></td>
            <td style="text-align:right"><strong>${fmtHours(totalMins)}</strong> (${totalHours.toFixed(2)} saat)</td>
            ${rate ? `<td style="text-align:right"><strong>${totalAmount.toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</strong></td>` : ''}
          </tr>
        </tbody>
      </table>
      </div>
      <div class="summary-box">
        <div class="line"><span>Toplam Çalışma Süresi</span><span>${fmtHours(totalMins)} (${totalHours.toFixed(2)} saat)</span></div>
        <div class="line"><span>Kayıt Sayısı</span><span>${data.length} giriş</span></div>
        ${rate ? `<div class="line"><span>Saatlik Ücret</span><span>${rate.toLocaleString('tr-TR')} ₺</span></div>` : ''}
        ${rate ? `<div class="line grand-total"><span>GENEL TOPLAM</span><span>${totalAmount.toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</span></div>` : ''}
      </div>
    </div>`;

  document.getElementById('reportModal').classList.add('open');
}

function closeModal() { document.getElementById('reportModal').classList.remove('open'); }

function printReport() {
  const content = document.getElementById('printArea').innerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Çalışma Raporu</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Roboto:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      body{font-family:'Fira Code',monospace;margin:0;background:#fff;color:#1a1a1a;font-size:12px;padding:0}
      h1{font-family:'Roboto',sans-serif;font-size:28px;margin-bottom:4px}
      .report-meta{color:#555;border-bottom:2px solid #6442d6;padding-bottom:16px;margin-bottom:24px;font-size:11px;line-height:1.8}
      table{width:100%;border-collapse:collapse;margin-bottom:24px}
      th{text-align:left;padding:8px 10px;background:#34246c;color:#fff;font-size:10px;letter-spacing:1px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      td{padding:8px 10px;border-bottom:1px solid #eee;font-size:11px}
      tr:nth-child(even) td{background:#f8f8f8}
      .total-row td{background:#eee9fa;font-weight:600;border-top:2px solid #6442d6}
      .summary-box{background:#f3efff;color:#24164f;padding:16px 20px;border:1px solid #c8b3fd}
      .summary-box .line{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
      .summary-box .grand-total{font-size:18px;font-weight:700;color:#4f32b5;padding-top:12px;margin-top:8px;border-top:1px solid #8d75cf}
      .report-table-scroll{overflow:visible}.report-table-scroll table{min-width:0}
      @media print{body{-webkit-print-color-adjust:exact}}
    </style></head><body>${content}</body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 500);
}

// ─── TOAST ────────────────────────────────────────────────
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
